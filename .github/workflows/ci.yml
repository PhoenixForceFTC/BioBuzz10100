name: CI

# Runs on every pull request and on pushes to the team branch. It repeats the checks the team already runs by hand:
#   Zenith: npm run zenith:validate / zenith:test / zenith:check
#   Android: ./gradlew :TeamCode:testDebugUnitTest :TeamCode:assembleDebug
# Not included on purpose: the SimLoop suite (:TeamCode:simTeleOpTest). Three of its tests fail on V1 today, so adding it
# would make every run red. Add it once those are triaged (see doc/CodeReview-2026-11-21.md, item M1).

on:
  pull_request:
  push:
    branches: [V1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zenith:
    name: Zenith routines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Validate routines against the robot code and the field rules
        run: npm run zenith:validate
      - name: Zenith deployment tests
        run: npm run zenith:test
      - name: Deployed assets are up to date (run "npm run zenith:deploy" if this fails)
        run: npm run zenith:check

  android:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-30 build-tools;30.0.3 ndk;21.3.6528147
      - uses: gradle/actions/setup-gradle@v6
      - name: Make the wrapper executable
        run: chmod +x ./gradlew
      - name: Unit tests and debug APK
        run: ./gradlew :TeamCode:testDebugUnitTest :TeamCode:assembleDebug --stacktrace
      - name: Keep the test report if it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: TeamCode/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
